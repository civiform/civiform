name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 23 * * 5'

permissions:
  contents: read

jobs:
  # Pull requests analyze only the languages whose files changed. Pushes to main and the
  # weekly scan analyze every language.
  changes:
    name: Detect changed languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ github.event_name == 'pull_request' && steps.changed.outputs.changed_keys || '["java-kotlin","javascript-typescript","python"]' }}
    steps:
    - name: Checkout repository
      if: github.event_name == 'pull_request'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Find changed languages
      id: changed
      if: github.event_name == 'pull_request'
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        json: 'true'
        escape_json: 'false'
        # Each key is a CodeQL language; `changed_keys` lists the ones with changed files.
        files_yaml: |
          java-kotlin:
            - .github/workflows/codeql.yml
            - server/**/*.java
            - server/build.sbt
            - server/project/**
          javascript-typescript:
            - .github/workflows/codeql.yml
            - '**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
            # The JS extractor also analyzes inline scripts in HTML, including Thymeleaf templates.
            - '**/*.html'
          python:
            - .github/workflows/codeql.yml
            - '**/*.py'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
        # Ruby is not analyzed. The app has no Ruby, and the scanner failed on the Russian
        # translation file because `.ru` is also the extension for Ruby rackup files.

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}
        # For Java, `none` analyzes Java only, not Kotlin.
        build-mode: none
        # Test code is about half of the Java source and most of its extraction time.
        config: |
          paths-ignore:
            - server/test

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: "/language:${{ matrix.language }}"
