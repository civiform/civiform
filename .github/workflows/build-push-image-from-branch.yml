name: Build a server image from a branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The branch to build from. release/* branches produce a RELEASE- image that can be promoted with the Release workflow; any other branch produces a DEV- image for testing only.'
        required: true

permissions: read-all

jobs:
  build_and_push:
    name: Build server image from branch ${{ github.event.inputs.branch_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch_name }}
      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push server image
        id: build_and_push_image
        env:
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USER_NAME }}
        run: bin/build-and-push-image-for-testing
