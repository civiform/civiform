<!--/*
  Shows the program details.
*/-->
<!doctype html>
<html th:attr="lang=${preferredLanguage.code()},dir=${shouldDisplayRtl}? 'rtl'">
  <head
    th:replace="~{applicant/ApplicantBaseFragment :: pageHeaderScriptsAndLinks}"
  ></head>
  <body th:hx-headers='|{"CSRF-TOKEN":"${csrfToken}"}|'>
    <div th:replace="~{applicant/ApplicantBaseFragment :: skipNav}"></div>
    <div
      th:replace="~{applicant/shared/NavigationFragment :: pageHeader}"
    ></div>
    <main id="main-content" tabindex="-1">
      <div
        th:replace="~{applicant/shared/NavigationFragment :: adminPreviewBackButton(${goBackToAdminUrl})}"
      ></div>
      <div
        th:replace="~{applicant/blocks/TitleAndDescriptionFragment ::
          titleAndDescriptionFragment(
          #{heading.programOverview(${programName})},
          ${programDescription})}"
      ></div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="tablet:grid-col-8">
            <div th:if="${!loginOnly and isGuest}">
              <h2
                class="cf-prose-h3 margin-top-0 margin-bottom-2"
                th:text="#{heading.startApplication}"
              ></h2>
              <div
                class="cf-start-application-card"
                data-testid="start-application-card"
              >
                <p
                  class="margin-top-0 margin-bottom-2"
                  th:text="#{content.startApplicationPrompt}"
                ></p>
                <div class="cf-start-application-actions">
                  <a
                    class="usa-button margin-left-0"
                    role="button"
                    th:href="${createAccountLink}"
                    th:text="#{button.loginToStartApplication}"
                  ></a>
                  <a
                    class="usa-link"
                    role="button"
                    th:href="${actionUrl}"
                    th:text="#{link.startAsGuest}"
                  ></a>
                </div>
              </div>
            </div>
            <a
              th:if="${!isGuest}"
              th:href="${actionUrl}"
              class="usa-button"
              th:text="${hasStartedOrSubmittedApplication} ? #{button.continueApplication} : #{button.startApplication}"
            ></a>

            <a
              th:if="${loginOnly and isGuest}"
              th:href="${loginLink}"
              class="usa-button"
              th:text="#{button.startAppForLoginOnlyProgram}"
            ></a>

            <!--*/ Application steps */-->
            <div class="usa-prose section" data-testId="steps-and-alerts">
              <h2 th:text="#{heading.applicationSteps}"></h2>
              <ol class="usa-process-list">
                <li
                  th:each="applicationStep : ${applicationSteps}"
                  class="usa-process-list__item"
                >
                  <h3
                    th:text="${applicationStep.getKey()}"
                    class="usa-process-list__heading"
                  ></h3>
                  <p th:utext="${applicationStep.getValue()}"></p>
                </li>
              </ol>
              <div
                th:if="${showEligibilityAlert}"
                data-testid="eligibility-alert"
              >
                <div th:if="${isEligible}">
                  <div
                    th:replace="~{components/AlertFragment ::
                alert(alertSettings=${eligibilityAlertSettings}, headingLevel='H6')}"
                  ></div>
                </div>
                <div th:if="${!isEligible}">
                  <div
                    th:replace="~{components/AlertFragment ::
                alert(alertSettings=${nonEligibilityAlertSettings}, headingLevel='H6')}"
                  ></div>
                </div>
              </div>
              <div th:if="${isGuest}" class="section-internal">
                <div
                  th:replace="~{applicant/shared/CreateAccountAlertFragment :: programOverviewCreateAccount(${createAccountLink}, ${actionUrl}, #{button.loginToStartApplication}, #{link.startAsGuest})}"
                ></div>
              </div>
              <div th:if="${!isGuest}" class="section-internal">
                <a
                  th:href="${actionUrl}"
                  class="usa-button"
                  th:text="${hasStartedOrSubmittedApplication} ? #{button.continueApplication} : #{button.startApplication}"
                ></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer
      th:replace="~{applicant/shared/NavigationFragment :: pageFooter}"
    ></footer>
    <th:block
      th:replace="~{components/GoogleTagManagerFragment :: tagManager(${optionalMeasurementId}, ${cspNonce})}"
    ></th:block>
  </body>
</html>
