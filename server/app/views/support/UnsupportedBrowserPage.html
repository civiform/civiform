<!--/*@thymesVar id="model" type="views.support.UnsupportedBrowserPageView.Model"*/-->
<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <p>
    Please use one of the browsers listed below. If you are using Windows you
    should have Microsoft Edge installed on your computer.
  </p>
  <div class="grid-row grid-gap margin-y-6">
    <div class="grid-col-6 tablet:grid-col-3 margin-bottom-3 text-center">
      <img
        src="/assets/images/edge-logo-128px.png"
        alt="Microsoft Edge logo"
        class="width-10 height-10 margin-x-auto margin-bottom-1"
      />
      <div>Microsoft Edge</div>
    </div>
    <div class="grid-col-6 tablet:grid-col-3 margin-bottom-3 text-center">
      <img
        src="/assets/images/firefox-logo-128px.png"
        alt="Firefox logo"
        class="width-10 height-10 margin-x-auto margin-bottom-1"
      />
      <div>Firefox</div>
    </div>
    <div class="grid-col-6 tablet:grid-col-3 margin-bottom-3 text-center">
      <img
        src="/assets/images/safari-logo-128px.png"
        alt="Safari logo"
        class="width-10 height-10 margin-x-auto margin-bottom-1"
      />
      <div>Safari</div>
    </div>
    <div class="grid-col-6 tablet:grid-col-3 margin-bottom-3 text-center">
      <img
        src="/assets/images/chrome-logo-128px.png"
        alt="Google Chrome logo"
        class="width-10 height-10 margin-x-auto margin-bottom-1"
      />
      <div>Google Chrome</div>
    </div>
  </div>
</th:block>
