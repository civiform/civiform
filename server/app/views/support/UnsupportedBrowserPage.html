<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="layoutParams" type="views.shared.LayoutParams"*/-->
<!--/*
  Standalone page shown to browsers UnsupportedBrowserFilter rejects (IE).
  Rendered without a layout: no navigation, session handling or JS bundles,
  which those browsers can't run anyway. Body classes match
  ApplicantStyles.BODY.
*/-->
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title th:text="${templateGlobals.pageTitle()}"></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      th:if="${layoutParams.addNoIndexMetaTag()}"
      name="robots"
      content="noindex"
    />
    <link
      th:each="stylesheet: ${layoutParams.stylesheets()}"
      th:nonce="${templateGlobals.cspNonce()}"
      th:href="${stylesheet}"
      type="text/css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-civiform-white h-full w-full flex flex-col">
    <main>
      <div class="container mx-auto max-w-xl p-4">
        <h1 class="text-center mb-4">Unsupported browser</h1>
        <div
          th:text="'Please use one of the browsers listed below. If you are using Windows you should have Microsoft Edge installed on your computer.'"
        ></div>
        <div class="flex flex-wrap justify-around mt-6">
          <div class="w-1/2 md:w-1/4 mb-6">
            <img
              src="/assets/images/edge-logo-128px.png"
              alt="Microsoft Edge logo"
              class="w-24 h-24 mx-auto mb-2"
            />
            <div class="text-center">Microsoft Edge</div>
          </div>
          <div class="w-1/2 md:w-1/4 mb-6">
            <img
              src="/assets/images/firefox-logo-128px.png"
              alt="Firefox logo"
              class="w-24 h-24 mx-auto mb-2"
            />
            <div class="text-center">Firefox</div>
          </div>
          <div class="w-1/2 md:w-1/4 mb-6">
            <img
              src="/assets/images/safari-logo-128px.png"
              alt="Safari logo"
              class="w-24 h-24 mx-auto mb-2"
            />
            <div class="text-center">Safari</div>
          </div>
          <div class="w-1/2 md:w-1/4 mb-6">
            <img
              src="/assets/images/chrome-logo-128px.png"
              alt="Google Chrome logo"
              class="w-24 h-24 mx-auto mb-2"
            />
            <div class="text-center">Google Chrome</div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
