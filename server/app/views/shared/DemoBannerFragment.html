<div th:fragment="demoBanner" th:if="${demoBannerEnabled}">
  <section
    class="usa-site-alert usa-site-alert--slim usa-site-alert--no-icon cf-alert cf-demo-banner"
    role="region"
    th:aria-label="#{label.demoBanner.label}"
  >
    <div class="usa-alert">
      <div class="usa-alert__body">
        <div class="cf-demo-banner__info">
          <p
            class="usa-alert__text text-bold"
            th:text="#{label.demoBanner.heading(${civicEntityShortName})}"
          ></p>
          <div th:if="${demoBannerDaysRemainingCount != null}">
            <span
              th:class="|usa-tag ${demoBannerDaysRemainingCount > 5 ? 'bg-green' : 'bg-yellow text-ink'}|"
              th:text="#{banner.demoBanner.daysRemaining(${demoBannerDaysRemainingCount})}"
            ></span>
          </div>
        </div>
        <div class="cf-demo-banner__actions" th:if="${showDebugTools}">
          <span class="cf-demo-banner__login-label">View as:</span>
          <ul class="usa-button-group usa-button-group--segmented">
            <li class="usa-button-group__item">
              <a
                th:if="${isAdminOrTi}"
                th:href="${logoutLink}"
                class="usa-button usa-button--outline"
                id="resident"
                >Resident</a
              >
              <button
                th:unless="${isAdminOrTi}"
                type="button"
                class="usa-button"
                id="resident"
                disabled
              >
                Resident
              </button>
            </li>
            <li class="usa-button-group__item">
              <button
                th:if="${isCiviFormAdmin}"
                type="button"
                class="usa-button"
                id="admin"
                disabled
              >
                Civiform Admin
              </button>
              <a
                th:unless="${isCiviFormAdmin}"
                th:href="${fakeCiviformAdminUrl}"
                class="usa-button usa-button--outline"
                id="admin"
                >Civiform Admin</a
              >
            </li>
            <li class="usa-button-group__item">
              <button
                th:if="${isOnlyProgramAdmin}"
                type="button"
                class="usa-button"
                id="program-admin"
                disabled
              >
                Program Admin
              </button>
              <a
                th:unless="${isOnlyProgramAdmin}"
                th:href="${fakeProgramAdminUrl}"
                class="usa-button usa-button--outline"
                id="program-admin"
                >Program Admin</a
              >
            </li>
            <li class="usa-button-group__item">
              <button
                th:if="${isTrustedIntermediary}"
                type="button"
                class="usa-button"
                id="trusted-intermediary"
                disabled
              >
                Trusted Intermediary
              </button>
              <a
                th:unless="${isTrustedIntermediary}"
                th:href="${fakeTrustedIntermediaryUrl}"
                class="usa-button usa-button--outline"
                id="trusted-intermediary"
                >Trusted Intermediary</a
              >
            </li>
          </ul>
          <a
            th:href="${additionalToolsUrl}"
            class="usa-button usa-button--outline cf-demo-banner__icon-button"
            id="additional-tools"
            aria-label="Additional tools"
          >
            <svg
              class="usa-icon"
              aria-hidden="true"
              role="img"
              th:attr="viewBox=${cogIcon.getViewBox()}"
            >
              <path th:attr="d=${cogIcon.path}"></path>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </section>
</div>
