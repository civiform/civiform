<!--/*@thymesVar id="demoBanner" type="views.shared.DemoBanner"*/-->
<div th:fragment="demoBanner" th:if="${demoBanner.enabled()}">
  <section
    class="usa-site-alert usa-site-alert--info usa-site-alert--slim usa-site-alert--no-icon cf-alert cf-demo-banner"
    role="region"
    th:aria-label="#{label.demoBanner.label}"
  >
    <div class="usa-alert">
      <div class="usa-alert__body">
        <div class="cf-demo-banner__info">
          <p
            class="usa-alert__text text-bold"
            th:text="#{label.demoBanner.heading(${demoBanner.civicEntityShortName()})}"
          ></p>
          <div th:if="${demoBanner.daysRemainingCount().isPresent()}">
            <span
              th:with="days=${demoBanner.daysRemainingCount().get()}"
              th:class="|usa-tag ${days > 5 ? 'bg-green' : 'bg-yellow text-ink'}|"
              th:text="${days == 1 ? #messages.msg('banner.demoBanner.dayRemaining') : #messages.msg('banner.demoBanner.daysRemaining', days)}"
            ></span>
          </div>
        </div>
        <div
          class="cf-demo-banner__actions"
          th:if="${demoBanner.showDebugTools()}"
        >
          <span class="cf-demo-banner__login-label">View as:</span>
          <ul class="usa-button-group usa-button-group--segmented">
            <li
              th:replace="~{this :: roleButton('resident', 'Resident', ${demoBanner.logoutUrl()}, ${demoBanner.isResident()})}"
            ></li>
            <li
              th:replace="~{this :: roleButton('admin', 'Civiform Admin', ${demoBanner.fakeCiviformAdminUrl()}, ${demoBanner.isCiviFormAdmin()})}"
            ></li>
            <li
              th:replace="~{this :: roleButton('program-admin', 'Program Admin', ${demoBanner.fakeProgramAdminUrl()}, ${demoBanner.isOnlyProgramAdmin()})}"
            ></li>
            <li
              th:replace="~{this :: roleButton('trusted-intermediary', 'Trusted Intermediary', ${demoBanner.fakeTrustedIntermediaryUrl()}, ${demoBanner.isTrustedIntermediary()})}"
            ></li>
          </ul>
          <a
            th:href="${demoBanner.additionalToolsUrl()}"
            class="usa-button usa-button--outline cf-demo-banner__icon-button"
            id="additional-tools"
            aria-label="Additional tools"
          >
            <svg
              class="usa-icon"
              aria-hidden="true"
              role="img"
              th:attr="viewBox=${demoBanner.cogIcon().getViewBox()}"
            >
              <path th:attr="d=${demoBanner.cogIcon().path}"></path>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </section>
</div>

<li
  th:fragment="roleButton(id, label, href, isActive)"
  class="usa-button-group__item"
>
  <div th:if="${isActive}" class="usa-button" th:id="${id}">
    <span th:text="${label}"></span
    ><span class="usa-sr-only"> (current role)</span>
  </div>
  <a
    th:unless="${isActive}"
    th:href="${href}"
    class="usa-button usa-button--outline"
    th:id="${id}"
    th:text="${label}"
  ></a>
</li>
