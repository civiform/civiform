<div
  th:fragment="radio(question, questionRendererParams)"
  th:with="questionId=${'id-' + #strings.randomAlphanumeric(8)},
  singleSelectQuestion=${question.createSingleSelectQuestion()},
  hasErrors=${questionRendererParams.shouldShowErrors() && !singleSelectQuestion.getValidationErrors().isEmpty()}"
  th:id="${questionId}"
  class="cf-question-radio cf-applicant-question-field"
  th:classappend="${hasErrors ? 'cf-question-field-with-error' : ''}"
  data-testid="questionRoot"
>
  <fieldset
    class="usa-fieldset"
    th:aria-labelledby="|${questionId}-title ${questionId}-description|"
    th:aria-describedby="${questionId} + '-description'"
  >
    <!--/* Title and Help Text */-->
    <div
      th:replace="~{questiontypes/QuestionBaseFragment :: titleAndHelpTextMultipleInput(${question}, ${questionId})}"
    ></div>

    <div
      th:replace="~{this :: radioFields(
        question=${question},
        questionRendererParams=${questionRendererParams},
        questionId=${questionId},
        listErrorsId=null)}"
    ></div>
  </fieldset>
</div>

<!--/* Radio question rendered as an enumerator's initial question inside an entity row. The entity
     row (see EnumeratorQuestionFragment :: initialQuestionEntityRowMultipleInput) supplies the
     role="group" wrapper and the group label, so the title, help text, and standalone fieldset are
     omitted here. */-->
<div
  th:fragment="radioForInitialQuestion(question, questionRendererParams, listErrorsId)"
  th:with="questionId=${'id-' + #strings.randomAlphanumeric(8)},
  singleSelectQuestion=${question.createSingleSelectQuestion()},
  hasErrors=${questionRendererParams.shouldShowErrors() && !singleSelectQuestion.getValidationErrors().isEmpty()}"
  th:id="${questionId}"
  class="cf-question-radio cf-applicant-question-field"
  th:classappend="${hasErrors ? 'cf-question-field-with-error' : ''}"
>
  <div
    th:replace="~{this :: radioFields(
      question=${question},
      questionRendererParams=${questionRendererParams},
      questionId=${questionId},
      listErrorsId=${listErrorsId})}"
  ></div>
</div>

<!--/* The radio option inputs and question-level errors, shared by the standalone and
     initial-question fragments. listErrorsId is the enumerator's list-level errors id when this is
     the first entity row of a list with such an error (otherwise null); the first option's
     aria-describedby starts with it, and the first option takes FIRST_FIELD autofocus. */-->
<th:block
  th:fragment="radioFields(question, questionRendererParams, questionId, listErrorsId)"
  th:with="singleSelectQuestion=${question.createSingleSelectQuestion()},
  hasErrors=${questionRendererParams.shouldShowErrors() && !singleSelectQuestion.getValidationErrors().isEmpty()}"
>
  <!--/* Display errors */-->
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${singleSelectQuestion.getValidationErrors().get(question.getContextualizedPath())}, ${questionRendererParams}, ${questionId})}"
  ></div>

  <!--/* Render each radio button option */-->
  <div
    class="usa-radio cf-multi-option-question-option"
    th:each="option,iterator: ${singleSelectQuestion.getOptions()}"
    th:with="inputId=${'id-' + #strings.randomAlphanumeric(8)},ariaLabelForNewTabs=#{link.opensNewTabSr}"
  >
    <div
      th:replace="~{components/RadioButtonOptionFragment :: radioButtonOptionFragment(
          ${inputId},
          ${option.id()},
          ${singleSelectQuestion.getSelectionPath()},
          ${singleSelectQuestion.optionIsSelected(option)},
          ${!question.isOptional()},
          ${questionRendererParams.autofocusSingleField() && iterator.index == 0},
          ${option.formattedOptionText(ariaLabelForNewTabs)},
          ${hasErrors},
          ${questionId},
          ${iterator.index == 0 ? listErrorsId : null})}"
    ></div>
  </div>
</th:block>
