<div
  th:fragment="dropdown(question, questionRendererParams)"
  th:with="singleSelectQuestion=${question.createSingleSelectQuestion()},
              questionId=${'id-' + #strings.randomAlphanumeric(8)},
              inputId=${'id-' + #strings.randomAlphanumeric(8)},
              questionErrors=${singleSelectQuestion.getValidationErrors().get(question.getContextualizedPath())},
              hasErrors=${questionRendererParams.shouldShowErrors() && questionErrors != null && !questionErrors.isEmpty()}"
  th:id="${questionId}"
  class="cf-applicant-question-field cf-dropdown-question"
  th:classappend="${hasErrors ? 'cf-question-field-with-error' : ''}"
  data-testid="questionRoot"
>
  <!--/* Title and Help Text */-->
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: titleAndHelpTextSingleInput(${question}, ${questionId}, ${inputId})}"
  ></div>

  <div
    th:replace="~{this :: dropdownField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      inputId=${inputId},
      isInitialQuestion=false,
      ariaLabelledby=null,
      ariaDescribedby=null,
      errorAnchorId=${questionId})}"
  ></div>
</div>

<!--/* Dropdown question rendered as an enumerator's initial question inside an entity row: no
     title/help (the entity row supplies its own row-specific label), and the caller passes
     aria-labelledby/aria-describedby so the first entity announces the enumerator title/help. */-->
<div
  th:fragment="dropdownForInitialQuestion(question, questionRendererParams, inputId, ariaLabelledby, ariaDescribedby)"
>
  <div
    th:replace="~{this :: dropdownField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      inputId=${inputId},
      isInitialQuestion=true,
      ariaLabelledby=${ariaLabelledby},
      ariaDescribedby=${ariaDescribedby},
      errorAnchorId=${inputId})}"
  ></div>
</div>

<!--/* Shared dropdown select and its validation errors, used by both dropdown and
     dropdownForInitialQuestion. When isInitialQuestion is true the select is labeled/described by the
     caller-supplied aria-labelledby/aria-describedby (the enumerator title/help); otherwise it is
     described by its own title/help text. The caller supplies errorAnchorId (the standalone question
     id, or the input id for an initial question), which the error/description element ids hang off
     of. */-->
<th:block
  th:fragment="dropdownField(question, questionRendererParams, inputId, isInitialQuestion, ariaLabelledby, ariaDescribedby, errorAnchorId)"
  th:with="singleSelectQuestion=${question.createSingleSelectQuestion()},
              questionErrors=${singleSelectQuestion.getValidationErrors().get(question.getContextualizedPath())},
              hasErrors=${questionRendererParams.shouldShowErrors() && questionErrors != null && !questionErrors.isEmpty()}"
>
  <!--/* Display errors */-->
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${questionErrors}, ${questionRendererParams}, ${errorAnchorId})}"
  ></div>

  <select
    class="usa-select cf-input-large"
    th:classappend="${hasErrors ? 'usa-input--error' : ''}"
    name="options"
    th:id="${inputId}"
    th:name="${singleSelectQuestion.getSelectionPath()}"
    th:aria-required="${!question.isOptional()}"
    th:aria-labelledby="${isInitialQuestion ? ariaLabelledby}"
    th:aria-describedby="${isInitialQuestion ? ariaDescribedby : errorAnchorId + '-description' + (hasErrors ? ' ' + errorAnchorId + '-error' : '')}"
    th:autofocus="${questionRendererParams.autofocusFirstError()}"
  >
    <option
      value
      hidden
      th:selected="${!singleSelectQuestion.hasValue()}"
      th:text="#{placeholder.noDropdownSelection}"
    ></option>
    <option
      th:each="option,iterator: ${singleSelectQuestion.getOptions()}"
      th:value="${option.id()}"
      th:text="${option.optionText()}"
      th:selected="${singleSelectQuestion.optionIsSelected(option)}"
    ></option>
  </select>
</th:block>
