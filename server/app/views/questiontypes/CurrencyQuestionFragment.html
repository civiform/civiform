<div
  th:fragment="currency(question, questionRendererParams)"
  th:with="currencyQuestion=${question.createCurrencyQuestion()},
             questionId=${'id-' + #strings.randomAlphanumeric(8)},
             inputId=${'id-' + #strings.randomAlphanumeric(8)},
             hasErrors=${questionRendererParams.shouldShowErrors() && !currencyQuestion.getValidationErrors().isEmpty()}"
  th:id="${questionId}"
  class="cf-question-currency cf-applicant-question-field"
  th:classappend="${hasErrors ? 'cf-question-field-with-error' : ''}"
  data-testid="questionRoot"
>
  <!--/* Title and Help Text */-->
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: titleAndHelpTextSingleInput(${question}, ${questionId}, ${inputId})}"
  ></div>

  <div
    th:replace="~{this :: currencyField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      questionId=${questionId},
      inputId=${inputId},
      isInitialQuestion=false,
      ariaLabelledby=null,
      ariaDescribedby=null)}"
  ></div>
</div>

<!--/* Currency question rendered as an enumerator's initial question inside an entity row: no
     title/help (the entity row supplies the "<entity type> #N" label), and the caller passes
     aria-labelledby/aria-describedby so the first entity announces the enumerator title/help. */-->
<div
  th:fragment="currencyForInitialQuestion(question, questionRendererParams, inputId, ariaLabelledby, ariaDescribedby)"
>
  <div
    th:replace="~{this :: currencyField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      questionId=null,
      inputId=${inputId},
      isInitialQuestion=true,
      ariaLabelledby=${ariaLabelledby},
      ariaDescribedby=${ariaDescribedby})}"
  ></div>
</div>

<!--/* Shared currency input and its validation errors, used by both currency and
     currencyForInitialQuestion. When isInitialQuestion is true the input is labeled/described by the
     caller-supplied aria-labelledby/aria-describedby (the enumerator title/help); otherwise it is
     described by its own title/help text. */-->
<th:block
  th:fragment="currencyField(question, questionRendererParams, questionId, inputId, isInitialQuestion, ariaLabelledby, ariaDescribedby)"
  th:with="currencyQuestion=${question.createCurrencyQuestion()},
             fieldErrors=${currencyQuestion.getValidationErrors().get(currencyQuestion.getCurrencyPath())},
             questionErrors=${currencyQuestion.getValidationErrors().get(question.getContextualizedPath())},
             hasErrors=${questionRendererParams.shouldShowErrors() && !currencyQuestion.getValidationErrors().isEmpty()},
             errorAnchorId=${isInitialQuestion ? inputId : questionId}"
>
  <!--/* Display errors */-->
  <th:block th:if="${fieldErrors == null || fieldErrors.isEmpty()}">
    <div
      th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${questionErrors}, ${questionRendererParams}, ${errorAnchorId})}"
    ></div>
  </th:block>
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${fieldErrors}, ${questionRendererParams}, ${errorAnchorId})}"
  ></div>

  <div
    class="usa-input-group"
    th:classappend="${hasErrors ? 'usa-input-group--error' : ''}"
  >
    <div class="usa-input-prefix">$</div>
    <input
      th:with="value=${currencyQuestion.getCurrencyValue().isPresent() ?
                                currencyQuestion.getCurrencyValue().get().prettyPrint() :
                                currencyQuestion.getFailedUpdates().getOrDefault(currencyQuestion.getCurrencyPath(), '')}"
      class="usa-input"
      inputmode="decimal"
      currency
      th:id="${inputId}"
      th:name="${currencyQuestion.getCurrencyPath()}"
      th:value="${value}"
      th:aria-labelledby="${isInitialQuestion ? ariaLabelledby : null}"
      th:aria-describedby="${isInitialQuestion ? ariaDescribedby : questionId + '-description' + (hasErrors ? ' ' + questionId + '-error' : '')}"
      th:aria-required="${!question.isOptional()}"
      th:aria-invalid="${hasErrors}"
      th:autofocus="${questionRendererParams.autofocusFirstError()}"
    />
  </div>
</th:block>
