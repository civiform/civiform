<div
  th:fragment="phone(question, questionRendererParams)"
  th:with="phoneQuestion=${question.createPhoneQuestion()},
             questionId=${'id-' + #strings.randomAlphanumeric(8)},
             inputId=${'cf-phone-number-' + #strings.randomAlphanumeric(8)},
             hasErrors=${questionRendererParams.shouldShowErrors() && !phoneQuestion.getValidationErrors().isEmpty()}"
  th:id="${questionId}"
  class="cf-applicant-question-field cf-question-phone"
  th:classappend="${hasErrors ? 'cf-question-field-with-error' : ''}"
  data-testid="questionRoot"
>
  <!--/* Title and Help Text */-->
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: titleAndHelpTextSingleInput(${question}, ${questionId}, ${inputId})}"
  ></div>

  <div
    th:replace="~{this :: phoneField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      inputId=${inputId},
      isInitialQuestion=false,
      ariaLabelledby=null,
      ariaDescribedby=null,
      errorAnchorId=${questionId})}"
  ></div>
</div>

<!--/* Phone question rendered as an enumerator's initial question inside an entity row: no title/help
     (the entity row supplies its own row-specific label), and the caller passes
     aria-labelledby/aria-describedby so the first entity announces the enumerator title/help. */-->
<div
  th:fragment="phoneForInitialQuestion(question, questionRendererParams, inputId, ariaLabelledby, ariaDescribedby)"
>
  <div
    th:replace="~{this :: phoneField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      inputId=${inputId},
      isInitialQuestion=true,
      ariaLabelledby=${ariaLabelledby},
      ariaDescribedby=${ariaDescribedby},
      errorAnchorId=${inputId})}"
  ></div>
</div>

<!--/* Shared phone input and its validation errors, used by both phone and phoneForInitialQuestion.
     When isInitialQuestion is true the input is labeled/described by the caller-supplied
     aria-labelledby/aria-describedby (the enumerator title/help); otherwise it is described by its
     own title/help text. The caller supplies errorAnchorId (the standalone question id, or the input
     id for an initial question), which the error/description element ids hang off of. */-->
<th:block
  th:fragment="phoneField(question, questionRendererParams, inputId, isInitialQuestion, ariaLabelledby, ariaDescribedby, errorAnchorId)"
  th:with="phoneQuestion=${question.createPhoneQuestion()},
             fieldErrors=${phoneQuestion.getValidationErrors().get(phoneQuestion.getPhoneNumberPath())},
             questionErrors=${phoneQuestion.getValidationErrors().get(question.getContextualizedPath())},
             hasErrors=${questionRendererParams.shouldShowErrors() && !phoneQuestion.getValidationErrors().isEmpty()}"
>
  <!--/* Display errors */-->
  <th:block th:if="${fieldErrors == null || fieldErrors.isEmpty()}">
    <div
      th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${questionErrors}, ${questionRendererParams}, ${errorAnchorId})}"
    ></div>
  </th:block>
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${fieldErrors}, ${questionRendererParams}, ${errorAnchorId})}"
  ></div>

  <div class="cf-phone-number">
    <input
      type="text"
      class="usa-input usa-input--medium"
      th:classappend="${hasErrors ? 'usa-input--error' : ''}"
      maxlength="10000"
      inputmode="tel"
      th:id="${inputId}"
      th:name="${phoneQuestion.getPhoneNumberPath()}"
      th:value="${phoneQuestion.getPhoneNumberValue().orElse('')}"
      placeholder="(xxx) xxx-xxxx"
      th:aria-labelledby="${isInitialQuestion ? ariaLabelledby}"
      th:aria-describedby="${isInitialQuestion ? ariaDescribedby : errorAnchorId + '-description' + (hasErrors ? ' ' + errorAnchorId + '-error' : '')}"
      th:aria-required="${!question.isOptional()}"
      th:aria-invalid="${hasErrors}"
      th:autofocus="${questionRendererParams.autofocusFirstError()}"
    />
  </div>
</th:block>
