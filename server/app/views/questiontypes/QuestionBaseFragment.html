<th:block
  th:fragment="validationErrors(validationErrors, questionRendererParams, questionId)"
>
  <div
    th:each="error: ${validationErrors}"
    th:if="${questionRendererParams.shouldShowErrors()}"
    th:id="${questionId} + '-error'"
    th:text="#{toast.errorMessageOutline(#{${error.key.getKeyName()}(${error.args})})}"
    class="cf-question-error-message cf-applicant-question-errors"
  ></div>
</th:block>

<th:block
  th:fragment="titleAndHelpTextMultipleInput(question, questionId)"
  th:with="ariaLabelForNewTabs=#{link.opensNewTabSr}"
  th:remove="tag"
>
  <!--/* Question title */-->
  <legend th:id="${questionId} + '-title'" class="usa-legend display-flex">
    <div th:replace="~{this :: titleContent(${question})}"></div>
  </legend>

  <!--/* Question help text */-->
  <div
    th:id="${questionId} + '-description'"
    th:utext="${question.getFormattedQuestionHelpText(ariaLabelForNewTabs)}"
    class="font-sans-xs padding-top-05 cf-applicant-question-help-text margin-bottom-105"
  ></div>
</th:block>

<!--/* Same as titleAndHelpTextMultipleInput, but renders the title as a div rather than a legend so
     it can be referenced from a role="group" element's aria-labelledby without an enclosing
     fieldset. The enumerator initial-question rows use role="group" + aria-labelledby rather than a
     fieldset/legend because the first row's group label is a combination of two elements — the
     enumerator question title and the per-entity label ("<entity type> #N") — which a single
     <legend> can't express. */-->
<th:block
  th:fragment="titleAndHelpTextGroupLabel(question, questionId)"
  th:with="ariaLabelForNewTabs=#{link.opensNewTabSr}"
  th:remove="tag"
>
  <!--/* Question title */-->
  <div th:id="${questionId} + '-title'" class="usa-legend display-flex">
    <div th:replace="~{this :: titleContent(${question})}"></div>
  </div>

  <!--/* Question help text */-->
  <div
    th:id="${questionId} + '-description'"
    th:utext="${question.getFormattedQuestionHelpText(ariaLabelForNewTabs)}"
    class="font-sans-xs padding-top-05 cf-applicant-question-help-text margin-bottom-105"
  ></div>
</th:block>

<div
  th:fragment="titleAndHelpTextSingleInput(question, questionId, inputId)"
  class="margin-bottom-105"
  th:with="ariaLabelForNewTabs=#{link.opensNewTabSr}"
>
  <!--/* Question title */-->
  <label
    class="usa-label display-flex"
    th:id="${questionId} + '-title'"
    th:for="${inputId}"
  >
    <div th:replace="~{this :: titleContent(${question})}"></div>
  </label>

  <!--/* Question help text */-->
  <div
    th:id="${questionId} + '-description'"
    th:utext="${question.getFormattedQuestionHelpText(ariaLabelForNewTabs)}"
    class="cf-applicant-question-help-text"
  ></div>
</div>

<th:block
  th:fragment="titleContent(question)"
  th:with="ariaLabelForNewTabs=#{link.opensNewTabSr}"
>
  <span
    th:utext="${question.getFormattedQuestionText(ariaLabelForNewTabs)}"
    class="font-sans-lg cf-applicant-question-text"
  ></span>
</th:block>
