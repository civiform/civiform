<div
  th:fragment="static-text(question, questionRendererParams)"
  data-testid="staticQuestionRoot"
>
  <div
    class="cf-question-static cf-applicant-question-field"
    th:with="ariaLabel=#{link.opensNewTabSr},
             questionImageUrl=${questionRendererParams != null and questionRendererParams.questionImageUrl().isPresent() ? questionRendererParams.questionImageUrl().get() : ''},
             questionImageAltText=${questionRendererParams != null and questionRendererParams.questionImageAltText().isPresent() ? questionRendererParams.questionImageAltText().get() : ''}"
  >
    <div
      class="cf-applicant-question-text line-height-sans-6 font-sans-md"
      th:utext="${question.getQuestion().getFormattedTextForRendering(ariaLabel)}"
    ></div>

    <div
      th:if="${imagesInQuestionFeatureEnabled and questionImageUrl != null and !#strings.isEmpty(questionImageUrl)}"
      class="cf-question-image-container maxw-mobile-lg margin-top-2"
      data-testid="question-image-container"
    >
      <a
        th:href="${questionImageUrl}"
        target="_blank"
        rel="noopener noreferrer"
        class="cf-question-image-frame"
        th:aria-label="#{staticQuestion.imageEnlargeAltText}"
      >
        <img
          th:src="${questionImageUrl}"
          th:alt="${questionImageAltText}"
          class="cf-question-image"
        />
      </a>
      <p class="cf-question-image-caption margin-0">
        <span
          class="cf-question-image-description"
          th:text="${#strings.isEmpty(questionImageAltText) ? '' : (#strings.endsWith(questionImageAltText, '.') ? questionImageAltText : questionImageAltText + '.')}"
        ></span>
        <a
          th:href="${questionImageUrl}"
          target="_blank"
          rel="noopener noreferrer"
          class="usa-link margin-left-05 cf-question-image-link"
        >
          <span th:text="#{staticQuestion.imageEnlargeAltText}"></span>
          <span class="usa-sr-only" th:text="#{link.opensNewTabSr}"></span>
          <svg
            aria-hidden="true"
            focusable="false"
            class="usa-icon margin-left-05"
            role="img"
          >
            <use
              href="/assets/Images/uswds/sprite.svg#launch"
              xlink:href="/assets/Images/uswds/sprite.svg#launch"
            ></use></svg
        ></a>
      </p>
    </div>
  </div>
</div>
