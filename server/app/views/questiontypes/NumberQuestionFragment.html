<div
  th:fragment="number(question, questionRendererParams)"
  th:with="numberQuestion=${question.createNumberQuestion()},
             questionId=${'id-' + #strings.randomAlphanumeric(8)},
             inputId=${'id-' + #strings.randomAlphanumeric(8)},
             hasErrors=${questionRendererParams.shouldShowErrors() && !numberQuestion.getValidationErrors().isEmpty()}"
  th:id="${questionId}"
  class="cf-question-number cf-applicant-question-field"
  th:classappend="${hasErrors ? 'cf-question-field-with-error' : ''}"
  data-testid="questionRoot"
>
  <!--/* Title and Help Text */-->
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: titleAndHelpTextSingleInput(${question}, ${questionId}, ${inputId})}"
  ></div>

  <div
    th:replace="~{this :: numberField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      questionId=${questionId},
      inputId=${inputId},
      isInitialQuestion=false,
      ariaLabelledby=null,
      ariaDescribedby=null)}"
  ></div>
</div>

<!--/* Number question rendered as an enumerator's initial question inside an entity row: no title/help
     (the entity row supplies its own row-specific label), and the caller passes
     aria-labelledby/aria-describedby so the first entity announces the enumerator title/help. */-->
<div
  th:fragment="numberForInitialQuestion(question, questionRendererParams, inputId, ariaLabelledby, ariaDescribedby)"
>
  <div
    th:replace="~{this :: numberField(
      question=${question},
      questionRendererParams=${questionRendererParams},
      questionId=null,
      inputId=${inputId},
      isInitialQuestion=true,
      ariaLabelledby=${ariaLabelledby},
      ariaDescribedby=${ariaDescribedby})}"
  ></div>
</div>

<!--/* Shared number input and its validation errors, used by both number and
     numberForInitialQuestion. When isInitialQuestion is true the input is labeled/described by the
     caller-supplied aria-labelledby/aria-describedby (the enumerator title/help); otherwise it is
     described by its own title/help text. */-->
<th:block
  th:fragment="numberField(question, questionRendererParams, questionId, inputId, isInitialQuestion, ariaLabelledby, ariaDescribedby)"
  th:with="numberQuestion=${question.createNumberQuestion()},
             fieldErrors=${numberQuestion.getValidationErrors().get(numberQuestion.getNumberPath())},
             questionErrors=${numberQuestion.getValidationErrors().get(question.getContextualizedPath())},
             hasErrors=${questionRendererParams.shouldShowErrors() && !numberQuestion.getValidationErrors().isEmpty()},
             errorAnchorId=${isInitialQuestion ? inputId : questionId}"
>
  <!--/* Display errors */-->
  <th:block th:if="${fieldErrors == null || fieldErrors.isEmpty()}">
    <div
      th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${questionErrors}, ${questionRendererParams}, ${errorAnchorId})}"
    ></div>
  </th:block>
  <div
    th:replace="~{questiontypes/QuestionBaseFragment :: validationErrors(${fieldErrors}, ${questionRendererParams}, ${errorAnchorId})}"
  ></div>

  <input
    th:with="value=${numberQuestion.getNumberValue().isPresent() ? numberQuestion.getNumberValue().get(): null},
                    min=${numberQuestion.getQuestionDefinition().getMin().isPresent() ? numberQuestion.getQuestionDefinition().getMin().getAsLong() : null},
                    max=${numberQuestion.getQuestionDefinition().getMax().isPresent() ? numberQuestion.getQuestionDefinition().getMax().getAsLong() : null}"
    type="number"
    class="usa-input cf-input-large"
    th:classappend="${hasErrors ? 'usa-input--error' : ''}"
    inputmode="decimal"
    th:id="${inputId}"
    th:name="${numberQuestion.getNumberPath()}"
    th:value="${value}"
    th:min="${min}"
    th:max="${max}"
    th:aria-labelledby="${isInitialQuestion ? ariaLabelledby}"
    th:aria-describedby="${isInitialQuestion ? ariaDescribedby : questionId + '-description' + (hasErrors ? ' ' + questionId + '-error' : '')}"
    th:aria-required="${!question.isOptional()}"
    th:aria-invalid="${hasErrors}"
    th:autofocus="${questionRendererParams.autofocusFirstError()}"
  />
</th:block>
