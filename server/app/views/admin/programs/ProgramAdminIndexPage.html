<!--/* Program admin's list of the programs they administer. */-->
<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="model" type="views.admin.programs.ProgramAdminIndexPageViewModel"*/-->
<th:block th:fragment="content">
  <div class="px-20">
    <h1 class="my-4" th:text="${model.title}"></h1>
    <th:block th:each="card : ${model.programCards}">
      <div
        th:replace="~{admin/programs/fragments/ProgramAdminProgramCard :: programCard(${card})}"
      ></div>
    </th:block>
  </div>
</th:block>
