<!--/*
  Labeled textarea field for the migrated program details form, legacy
  FieldWithLabel-parity markup.

  Mirrors admin/shared/LegacyFieldWithLabel/TextareaField.html but adds the
  parameters the program form needs: a disabled state (the legacy form always
  set disabled and readonly together) and the wrapper classes (the legacy
  builder's .withClass(...) call REPLACED the wrapper's class attribute, so
  most program fields render "mb-4"; the confirmation message keeps its
  reference class as "pt-3 mb-2").

  The markdown indicator uses the link-less variant: the program form relied
  on FieldWithLabel's defaults, which render no docs link.
*/-->
<div
  th:fragment="textareaField(id, name, label, value, required, disabled, markdown, wrapperClasses)"
  th:class="${wrapperClasses}"
>
  <label
    th:for="${id}"
    class="pointer-events-none text-gray-600 text-base px-1 py-2"
    >[[${label}]]<span
      th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(${required})}"
    ></span
  ></label>
  <div class="flex flex-col">
    <textarea
      maxlength="10000"
      th:attr="aria-required=${required} ? 'true'"
      th:id="${id}"
      th:name="${name}"
      th:disabled="${disabled}"
      th:readonly="${disabled}"
      class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue placeholder-gray-500"
      th:classappend="${disabled} ? 'read-only:text-gray-500 read-only:bg-gray-100'"
      th:text="${value}"
    ></textarea>
    <div th:id="|${id}-errors|" class="text-red-600 text-xs p-1 hidden"></div>
  </div>
  <th:block th:if="${markdown}">
    <span
      th:replace="~{admin/shared/LegacyFieldWithLabel/MarkdownIndicator :: markdownIndicatorNoLink('Markdown is supported')}"
    ></span>
  </th:block>
</div>
