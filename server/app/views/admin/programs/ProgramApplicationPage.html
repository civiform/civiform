<!--/*
  Program admin view of a single submitted application.

  1:1 port of the legacy j2html ProgramApplicationView, rendered inside the
  transitional LegacyTailwindLayout. Slated for replacement during the admin
  redesign.
*/-->
<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="model" type="views.admin.programs.ProgramApplicationPageViewModel"*/-->
<th:block th:fragment="content">
  <!--/* Flash success toast, consumed by toast.ts. The legacy layout rendered it
         in the page header; it is a hidden data div, so position does not
         matter. */-->
  <div
    th:if="${model.successToast != null}"
    class="hidden cf-toast-data"
    th:id="${model.successToast.id}"
    canDismiss="true"
    canIgnore="false"
    toastDuration="0"
    condOnStorageKey
    toastType="SUCCESS"
    th:text="${model.successToast.message}"
  ></div>

  <!--/* The layout's <main> supplies the legacy centered wrapper, so this div is
         the direct child of <main> in the legacy j2html DOM. */-->
  <div id="application-view" class="px-20">
    <h2 class="my-4" th:text="|Program: ${model.programName}|"></h2>

    <a
      id="application-table-view-"
      th:href="${model.backUrl}"
      class="text-blue-600 hover:text-blue-500 inline-flex items-center block py-2 text-center rounded-full border bg-civiform-blue border-transparent text-white rounded-full font-semibold px-8 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-sm"
      >Back</a
    >

    <div class="flex flex-wrap items-center my-4 gap-2 justify-between">
      <p
        class="text-black text-2xl cf-application-id"
        th:text="${model.applicantNameWithApplicationId}"
      ></p>
      <div class="flex flex-wrap gap-2">
        <!--/* Status options, only if configured on the program. */-->
        <div th:if="${model.hasStatuses}" class="flex mr-4 gap-2">
          <div class="flex cf-program-admin-status-selector">
            <label class="self-center" th:for="${model.statusSelectorId}"
              >Status:</label
            >
            <select
              th:id="${model.statusSelectorId}"
              class="outline-none px-3 py-2 ml-3 border border-gray-500 rounded-lg bg-white text-lg focus:border-civiform-blue"
            >
              <!--/* Placeholder, selected when no status is applied yet. */-->
              <option
                disabled
                th:selected="${model.noStatusSelected}"
                th:text="'Choose an option:'"
              ></option>
              <option
                th:each="status : ${model.statusOptions}"
                th:value="${status.text}"
                th:selected="${status.selected}"
                th:text="${status.text}"
              ></option>
            </select>
          </div>
          <!--/* Trigger of the note modal (Modal.getButton). */-->
          <button
            th:id="|${model.noteModal.id}-button|"
            class="flex items-center font-medium space-x-2 border-none rounded-full bg-transparent text-civiform-blue hover:bg-gray-200"
          >
            <svg
              th:replace="~{admin/shared/LegacySvgFragments :: iconEdit('inline-block h-4.5 w-4.5')}"
            ></svg
            ><span
              class="text-left"
              th:text="${model.hasNote} ? 'Edit note' : 'Add note'"
            ></span>
          </button>
        </div>
        <!--/* data-redirect-to is picked up by main.ts, as
               BaseHtmlView.asRedirectElement intended. */-->
        <button
          th:if="${model.showDownloadButton}"
          class="font-semibold block py-2 text-center rounded-full border text-civiform-blue border-civiform-blue hover:bg-blue-100 flex items-center font-medium space-x-2 bg-white hover:bg-gray-200"
          th:data-redirect-to="${model.downloadUrl}"
        >
          <svg
            th:replace="~{admin/shared/LegacySvgFragments :: iconDownload('inline-block h-4.5 w-4.5')}"
          ></svg
          ><span class="text-left">Export to PDF</span>
        </button>
      </div>
    </div>

    <p class="text-xs text-gray-700 mb-2 cf-bt-date">
      <span
        th:text="${model.submitTime} ?: 'Application submitted without submission time marked.'"
      ></span>
    </p>

    <th:block th:each="block : ${model.blocks}">
      <div
        th:replace="~{admin/programs/fragments/ApplicationBlockCard :: blockCard(${block})}"
      ></div>
    </th:block>

    <!--/* Hidden triggers of the status confirmation modals; admin_application_view.ts
           clicks the one whose data attribute matches the selected status. */-->
    <button
      th:each="modal : ${model.statusModals}"
      type="button"
      class="hidden"
      th:data-status-update-confirm-for-status="${modal.statusText}"
      th:id="|${modal.id}-button|"
    ></button>
  </div>
</th:block>

<!--/* Modals, inserted by the layout into #modal-container: the note modal
       first, then one confirmation modal per status, as the legacy view added
       them. */-->
<th:block th:fragment="modals">
  <div
    th:replace="~{admin/programs/fragments/LegacyModal :: modal(${model.noteModal.id}, 'Edit note', ~{admin/programs/fragments/ApplicationNoteModal :: noteForm(${model.programId}, ${model.applicationId}, ${model.noteModal})})}"
  ></div>
  <th:block th:each="modal : ${model.statusModals}">
    <div
      th:replace="~{admin/programs/fragments/LegacyModal :: modal(${modal.id}, 'Change the status of this application?', ~{admin/programs/fragments/ApplicationStatusModal :: statusUpdateForm(${model.programId}, ${model.applicationId}, ${model.programName}, ${model.applicantNameWithApplicationId}, ${modal})})}"
    ></div>
  </th:block>
</th:block>
