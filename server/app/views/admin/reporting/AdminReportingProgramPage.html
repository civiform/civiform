<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="model" type="views.admin.reporting.AdminReportingProgramPageViewModel"*/-->
<th:block th:fragment="content">
  <div class="padding-4 spacing-4">
    <div class="spacing-1">
      <h1
        th:text="${#messages.msg('reportingProgram.heading', model.enUSLocalizedProgramName)}"
      ></h1>
      <p th:text="#{reportingProgram.dataDelay}"></p>
    </div>
    <section class="spacing-2">
      <h2
        id="by-month-heading"
        th:text="#{reportingProgram.caption.submissionsByMonth}"
      ></h2>

      <div class="usa-table-container--scrollable" tabindex="0">
        <table
          class="usa-table usa-table--striped usa-table--compact width-full"
          aria-labelledby="by-month-heading"
        >
          <thead>
            <tr>
              <th scope="col" th:text="#{reportingProgram.month}"></th>
              <th scope="col" th:text="#{reportingProgram.submissions}"></th>
              <th scope="col">
                <th:block
                  th:text="#{reportingProgram.timeToCompleteP25}"
                ></th:block>
                <a
                  class="usa-link text-normal"
                  href="#by-month-note-1"
                  aria-label="Note 1"
                  >[1]</a
                >
              </th>
              <th scope="col">
                <th:block
                  th:text="#{reportingProgram.medianTimeToComplete}"
                ></th:block>
                <a
                  class="usa-link text-normal"
                  href="#by-month-note-2"
                  aria-label="Note 2"
                  >[2]</a
                >
              </th>
              <th scope="col">
                <th:block
                  th:text="#{reportingProgram.timeToCompleteP75}"
                ></th:block>
                <a
                  class="usa-link text-normal"
                  href="#by-month-note-3"
                  aria-label="Note 3"
                  >[3]</a
                >
              </th>
              <th scope="col">
                <th:block
                  th:text="#{reportingProgram.timeToCompleteP99}"
                ></th:block>
                <a
                  class="usa-link text-normal"
                  href="#by-month-note-4"
                  aria-label="Note 4"
                  >[4]</a
                >
              </th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="stat : ${model.monthlySubmissionsForProgram}">
              <td th:text="${model.formatMonth(stat.timestamp.get())}"></td>
              <td class="text-right" th:text="${stat.applicationCount}"></td>
              <td
                class="text-right"
                th:text="${model.formatDuration(stat.submissionDurationSeconds25p)}"
              ></td>
              <td
                class="text-right"
                th:text="${model.formatDuration(stat.submissionDurationSeconds50p)}"
              ></td>
              <td
                class="text-right"
                th:text="${model.formatDuration(stat.submissionDurationSeconds75p)}"
              ></td>
              <td
                class="text-right"
                th:text="${model.formatDuration(stat.submissionDurationSeconds99p)}"
              ></td>
            </tr>
          </tbody>
        </table>
      </div>
      <a
        class="usa-button"
        th:href="${model.getDownloadProgramCsvUrl(model.programSlug)}"
        th:text="#{reportingProgram.downloadCsv}"
      ></a>

      <div class="spacing-1 padding-top-2">
        <h3 class="font-body-xs">Notes</h3>
        <ol class="usa-list font-body-xs">
          <li id="by-month-note-1">
            The fastest 25 percent of applicants finished in this time or less.
          </li>
          <li id="by-month-note-2">
            Half of all applicants finished in this time or less.
          </li>
          <li id="by-month-note-3">
            Most applicants (75 percent) finished in this time or less.
          </li>
          <li id="by-month-note-4">
            Almost all applicants (99 percent) finished in this time or less.
          </li>
        </ol>
      </div>
    </section>
  </div>
</th:block>
