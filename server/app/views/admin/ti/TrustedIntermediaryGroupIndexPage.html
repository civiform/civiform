<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="model" type="views.admin.ti.TrustedIntermediaryGroupIndexPageViewModel"*/-->
<th:block th:fragment="content">
  <!--/* Flash error toast, consumed by toast.ts. It is a hidden data div, so
         position does not matter. The id is the fixed one the legacy view
         passed to addToastMessagesOnError. Error toasts are not dismissible:
         the ToastMessage constructor overrides the canDismiss=true field
         default for ERROR. */-->
  <div
    th:if="${model.errorMessage != null}"
    id="warning-message-ti-form-fill"
    class="display-none cf-toast-data"
    canDismiss="false"
    canIgnore="false"
    toastDuration="0"
    condOnStorageKey
    toastType="ERROR"
    th:text="${model.errorMessage}"
  ></div>

  <h1 class="margin-top-0">Create new trusted intermediary</h1>
  <div
    class="maxw-tablet margin-top-3 padding-x-2 padding-bottom-3 border-1px border-base-lighter shadow-2"
  >
    <form method="POST" th:action="${model.createGroupUrl}">
      <!--/* Built by hand instead of with cf:input, which does not escape the
             value attribute. These values are user submitted text sent back
             through the flash after a failed create. */-->
      <div class="usa-form-group">
        <label class="usa-label" for="group-name-input">Name</label>
        <input
          type="text"
          id="group-name-input"
          name="name"
          class="usa-input"
          maxlength="10000"
          th:value="${model.providedName}"
        />
      </div>
      <div class="usa-form-group">
        <label class="usa-label" for="group-description-input"
          >Description</label
        >
        <input
          type="text"
          id="group-description-input"
          name="description"
          class="usa-input"
          maxlength="10000"
          th:value="${model.providedDescription}"
        />
      </div>
      <input
        type="hidden"
        th:value="${templateGlobals.csrfToken()}"
        name="csrfToken"
      />
      <button type="submit" class="usa-button margin-top-3">Create</button>
    </form>
  </div>

  <div
    class="display-flex flex-align-end flex-justify flex-wrap margin-top-6 margin-bottom-1"
  >
    <h2 class="margin-0">Existing trusted intermediaries</h2>
    <!--/* Sort select, wired up by admin_trusted_intermediary_list.ts through
         the cf-ti-list id and the cf-ti-sublist / cf-ti-element classes below. */-->
    <div>
      <label for="cf-ti-list" class="usa-label margin-top-0">Sort by:</label>
      <select id="cf-ti-list" name="" class="usa-select">
        <option value="" hidden></option>
        <optgroup label="Sort by:">
          <option
            th:each="sortOption : ${model.sortOptions}"
            class="cf-multi-option-question-option cf-multi-option-value"
            th:value="${sortOption.value}"
            th:selected="${sortOption.selected}"
            th:text="${sortOption.label}"
          ></option>
        </optgroup>
      </select>
    </div>
  </div>

  <table class="usa-table usa-table--striped width-full cf-ti-sublist">
    <thead>
      <tr>
        <th scope="col">Name / Description</th>
        <th scope="col">Size</th>
        <th scope="col" class="text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <!--/* data-tiname and data-nummember are the sort keys read by
             admin_trusted_intermediary_list.ts (QuestionSortOption.TI_NAME
             and TI_NUM_MEMBERS). */-->
      <tr
        th:each="group : ${model.groups}"
        class="cf-ti-row cf-ti-element"
        th:data-tiname="${group.name}"
        th:data-nummember="${group.memberCount}"
      >
        <td data-testid="ti-info">
          <div class="text-semibold" th:text="${group.name}"></div>
          <div class="font-sans-3xs" th:text="${group.description}"></div>
        </td>
        <td data-testid="ti-member">
          <div
            class="text-semibold"
            th:text="|Members: ${group.memberCount}|"
          ></div>
          <div
            class="font-sans-xs"
            th:text="|Clients: ${group.clientCount}|"
          ></div>
        </td>
        <td>
          <div class="display-flex flex-align-center flex-justify-end">
            <!--/* Not a link: main.ts navigates on click via data-redirect-to,
                   as the legacy asRedirectElement button did. */-->
            <button
              type="button"
              class="usa-button usa-button--outline display-flex flex-align-center"
              th:data-redirect-to="${group.editUrl}"
            >
              <svg
                th:replace="~{admin/shared/LegacySvgFragments :: iconEdit('usa-icon margin-right-05')}"
              ></svg>
              <span>Edit members</span>
            </button>
            <form method="POST" th:action="${group.deleteUrl}">
              <input
                type="hidden"
                th:value="${templateGlobals.csrfToken()}"
                name="csrfToken"
              />
              <button
                type="submit"
                class="usa-button usa-button--outline display-flex flex-align-center margin-right-0"
              >
                <svg
                  th:replace="~{admin/shared/LegacySvgFragments :: iconDelete('usa-icon margin-right-05')}"
                ></svg>
                <span>Delete</span>
              </button>
            </form>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</th:block>
