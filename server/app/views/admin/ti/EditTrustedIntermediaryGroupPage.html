<!--/*
  1:1 port of the legacy EditTrustedIntermediaryGroupView (j2html). Rendered in
  the transitional LegacyTailwindLayout; slated for replacement on redesign.
*/-->
<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="model" type="views.admin.ti.EditTrustedIntermediaryGroupPageViewModel"*/-->
<th:block th:fragment="content">
  <!--/* Flash error toast, consumed by toast.ts. The legacy layout rendered it
         in the page header; it is a hidden data div, so position does not
         matter. The id is the fixed one the legacy view passed to
         addToastMessagesOnError. */-->
  <div
    th:if="${model.errorMessage != null}"
    id="warning-message-ti-form-fill"
    class="hidden cf-toast-data"
    canDismiss="false"
    canIgnore="false"
    toastDuration="0"
    condOnStorageKey
    toastType="ERROR"
    th:text="${model.errorMessage}"
  ></div>

  <!--/* The layout's <main> supplies the legacy centered wrapper, so these are
         the direct children of <main> in the legacy j2html DOM. */-->
  <div class="my-5">
    <div class="grid-row">
      <a
        th:href="${model.backUrl}"
        class="text-blue-600 hover:text-blue-500 inline-flex items-center"
      >
        <!--/* No whitespace between the svg and the text, as in the legacy
               a(svg).with(text(...)) markup. */-->
        <svg
          th:replace="~{admin/shared/LegacySvgFragments :: iconArrowLeft('w-5 h-5 mr-2')}"
        ></svg
        >Back to all intermediaries</a
      >
    </div>
  </div>
  <h1 class="mb-4" th:text="${model.groupName}"></h1>
  <h2 class="mb-4" th:text="${model.groupDescription}"></h2>

  <div class="my-5">
    <div class="border border-gray-300 shadow-md mt-6">
      <form method="POST" th:action="${model.addIntermediaryUrl}">
        <div
          th:replace="~{admin/shared/LegacyFieldWithLabel/EmailField :: emailField('group-name-input', 'emailAddress', 'Member email address', ${model.providedEmailAddress}, false)}"
        ></div>
        <input
          type="hidden"
          th:value="${templateGlobals.csrfToken()}"
          name="csrfToken"
        />
        <button
          type="submit"
          class="block py-2 text-center rounded-full border bg-civiform-blue border-transparent text-white rounded-full font-semibold px-8 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-base ml-2 mb-6"
        >
          Add
        </button>
      </form>
    </div>
  </div>

  <table class="border border-gray-300 shadow-md w-full">
    <thead>
      <tr class="border-b bg-gray-200 text-left">
        <th class="px-4 py-2 w-1/2">Members</th>
        <th class="px-4 py-2 w-1/4">Status</th>
        <th class="px-4 py-2 text-right pr-8 w-1/6">Actions</th>
      </tr>
    </thead>
    <tbody>
      <th:block th:each="member : ${model.members}">
        <tr
          th:replace="~{admin/ti/fragments/TrustedIntermediaryRow :: tiRow(${member}, ${model.removeIntermediaryUrl})}"
        ></tr>
      </th:block>
    </tbody>
  </table>
</th:block>
