<!--/*
  Labeled text input field, legacy FieldWithLabel-parity markup for migrated admin pages.

  Mirrors TextareaField.html, but emits the <input type="text"> that
  FieldWithLabel.input().getInputTag() produced.

  Parameters beyond the basics mirror FieldWithLabel setters the legacy pages
  used:
    disabled       - the legacy pages always set disabled and readonly together,
                     so one flag renders both attributes plus the read-only
                     color classes. Pass false for an editable field.
    maxlength      - FieldWithLabel defaulted to '10000'; pass that unless the
                     legacy page called setMaxLength.
    wrapperClasses - the legacy builders' .withClass(...) call REPLACED the
                     wrapper's class attribute, so pass FieldWithLabel's
                     default 'mb-2' unless the page overrode it.

  Field ids: callers pass a fixed id, or generate a random 8-character
  alphabetic id so labels stay associated with inputs.
*/-->
<div
  th:fragment="textField(id, name, label, value, required, disabled, maxlength, wrapperClasses)"
  th:class="${wrapperClasses}"
>
  <label
    th:for="${id}"
    class="pointer-events-none text-gray-600 text-base px-1 py-2"
    >[[${label}]]<span
      th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(${required})}"
    ></span
  ></label>
  <div class="flex flex-col">
    <input
      type="text"
      th:value="${value}"
      th:maxlength="${maxlength}"
      th:attr="aria-required=${required} ? 'true'"
      th:id="${id}"
      th:name="${name}"
      th:disabled="${disabled}"
      th:readonly="${disabled}"
      class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue placeholder-gray-500"
      th:classappend="${disabled} ? 'read-only:text-gray-500 read-only:bg-gray-100'"
    />
    <div th:id="|${id}-errors|" class="text-red-600 text-xs p-1 hidden"></div>
  </div>
</div>
