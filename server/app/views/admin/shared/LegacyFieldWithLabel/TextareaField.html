<!--/*
  Labeled textarea field, legacy FieldWithLabel-parity markup for migrated admin pages.

  Parameters:
    disabled       - renders both the disabled and readonly attributes plus
                     the read-only color classes. Pass false for an editable
                     field.
    markdown       - renders the "Markdown is supported" indicator under the
                     field.
    markdownLink   - true renders the indicator with the docs link; false
                     renders the link-less variant. Ignored when markdown is
                     false.
    wrapperClasses - the wrapper's full class attribute; 'mb-2' is the
                     default.

  Field ids: callers pass a fixed id, or generate a random 8-character
  alphabetic id with ${model.randomFieldId()} so labels stay associated
  with inputs.

  textareaField keeps the nine-argument signature and delegates to
  textareaFieldWithRows, which additionally renders the rows attribute that
  FieldWithLabel.setRows(...) produced. Pass null for rows to omit it.
*/-->
<th:block
  th:fragment="textareaField(id, name, label, value, required, disabled, markdown, markdownLink, wrapperClasses)"
>
  <div
    th:replace="~{this :: textareaFieldWithRows(${id}, ${name}, ${label}, ${value}, ${required}, ${disabled}, ${markdown}, ${markdownLink}, ${wrapperClasses}, null)}"
  ></div>
</th:block>
<div
  th:fragment="textareaFieldWithRows(id, name, label, value, required, disabled, markdown, markdownLink, wrapperClasses, rows)"
  th:class="${wrapperClasses}"
>
  <label
    th:for="${id}"
    class="pointer-events-none text-gray-600 text-base px-1 py-2"
    >[[${label}]]<span
      th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(${required})}"
    ></span
  ></label>
  <div class="flex flex-col">
    <!--/* A null rows value drops the attribute entirely, matching the legacy
           textarea when no row count was configured. */-->
    <textarea
      maxlength="10000"
      th:attr="aria-required=${required} ? 'true',rows=${rows}"
      th:id="${id}"
      th:name="${name}"
      th:disabled="${disabled}"
      th:readonly="${disabled}"
      class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue placeholder-gray-500"
      th:classappend="${disabled} ? 'read-only:text-gray-500 read-only:bg-gray-100'"
      th:text="${value}"
    ></textarea>
    <div th:id="|${id}-errors|" class="text-red-600 text-xs p-1 hidden"></div>
  </div>
  <!--/* th:replace sits on an element nested inside each conditional:
         fragment inclusion is evaluated before th:if/th:unless, so combining
         them on one element would include both indicators. */-->
  <th:block th:if="${markdown}">
    <th:block th:if="${markdownLink}">
      <span
        th:replace="~{admin/shared/LegacyFieldWithLabel/MarkdownIndicator :: markdownIndicator('Markdown is supported, ')}"
      ></span>
    </th:block>
    <th:block th:unless="${markdownLink}">
      <span
        th:replace="~{admin/shared/LegacyFieldWithLabel/MarkdownIndicator :: markdownIndicatorNoLink('Markdown is supported')}"
      ></span>
    </th:block>
  </th:block>
</div>
