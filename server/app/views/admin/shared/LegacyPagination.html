<!--/*
  USWDS pagination control, legacy BaseHtmlView.renderPagination-parity
  markup for migrated pages. Which page buttons and ellipses appear
  is decided by mapping.admin.shared.LegacyPaginationMapper; these fragments
  only render the resulting views.admin.shared.LegacyPagination.

  The legacy renderer localized the arrow labels only when it was handed
  Messages, so there is one fragment per case:
    pagination          - English labels, for admin pages
    localizedPagination - labels in the viewer's language, for the pages
                          trusted intermediaries and applicants see
*/-->
<!--/*@thymesVar id="pagination" type="views.admin.shared.LegacyPagination"*/-->
<th:block th:fragment="pagination(pagination)">
  <nav
    th:replace="~{:: paginationNav(${pagination}, 'Previous', 'Next')}"
  ></nav>
</th:block>

<th:block th:fragment="localizedPagination(pagination)">
  <nav
    th:replace="~{:: paginationNav(${pagination}, #{button.previousScreen}, #{button.nextPage})}"
  ></nav>
</th:block>

<!--/* The control itself; use one of the two fragments above. */-->
<nav
  th:fragment="paginationNav(pagination, previousLabel, nextLabel)"
  class="usa-pagination"
  aria-label="Pagination"
>
  <ul class="usa-pagination__list">
    <li
      th:if="${pagination.previousPageUrl != null}"
      class="usa-pagination__item usa-pagination__arrow"
    >
      <a
        class="usa-pagination__link usa-pagination__previous-page"
        aria-label="Previous page"
        th:href="${pagination.previousPageUrl}"
      >
        <svg
          th:replace="~{admin/shared/LegacySvgFragments :: iconNavigateBefore('usa-icon h-4 w-4')}"
        ></svg>
        <span
          class="usa-pagination__link-text"
          th:text="${previousLabel}"
        ></span>
      </a>
    </li>
    <th:block th:each="item : ${pagination.items}">
      <li
        th:if="${item.ellipsis}"
        class="usa-pagination__item usa-pagination__overflow"
        aria-label="ellipsis indicating non-visible pages"
      >
        <span>...</span>
      </li>
      <!--/* The legacy aria-label had no space between "Page" and the number. */-->
      <li
        th:unless="${item.ellipsis}"
        class="usa-pagination__item usa-pagination__page-no"
      >
        <a
          class="usa-pagination__button"
          th:classappend="${item.current} ? 'usa-current'"
          th:href="${item.url}"
          th:aria-label="|Page${item.pageNumber}|"
          th:attr="aria-current=${item.current} ? 'page'"
          th:text="${item.pageNumber}"
        ></a>
      </li>
    </th:block>
    <li
      th:if="${pagination.nextPageUrl != null}"
      class="usa-pagination__item usa-pagination__arrow"
    >
      <a
        class="usa-pagination__link usa-pagination__next-page"
        aria-label="Next page"
        th:href="${pagination.nextPageUrl}"
      >
        <span class="usa-pagination__link-text" th:text="${nextLabel}"></span>
        <svg
          th:replace="~{admin/shared/LegacySvgFragments :: iconNavigateNext('usa-icon h-4 w-4')}"
        ></svg>
      </a>
    </li>
  </ul>
</nav>
