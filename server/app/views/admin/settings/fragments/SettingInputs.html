<!--/*
  Inputs for a single server setting, legacy FieldWithLabel/SelectWithLabel
  parity markup for the migrated admin settings page.

  The settings page never labels its fields (the variable name is rendered
  above the input instead), so every field carries the screen-reader-only
  empty label and hidden required indicator that FieldWithLabel emitted for a
  field with no label text.

  Read-only settings render disabled (and, where the legacy code set it,
  read-only) inputs plus the "Read-only" note. USWDS styles the disabled
  state, so no extra classes are needed for it.
*/-->

<!--/* Text input for STRING and LIST_OF_STRINGS settings. */-->
<div
  th:fragment="stringInput(id, name, value, readOnly, errorMessage)"
  class="margin-top-1"
>
  <div class="margin-bottom-1" th:data-testid="|string-${name}|">
    <label th:for="${id}" class="usa-sr-only"
      ><span
        th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(false)}"
      ></span
    ></label>
    <div class="display-flex flex-column">
      <input
        type="text"
        th:value="${value}"
        maxlength="10000"
        th:id="${id}"
        th:name="${name}"
        placeholder="empty"
        th:disabled="${readOnly}"
        th:readonly="${readOnly}"
        class="usa-input maxw-full"
        th:classappend="${errorMessage != null} ? 'usa-input--error' : ''"
      />
      <div th:id="|${id}-errors|" class="usa-error-message display-none"></div>
    </div>
    <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
    <div
      th:if="${errorMessage != null}"
      class="usa-error-message"
      th:text="${errorMessage}"
    ></div>
  </div>
</div>

<!--/*
  Number input for INT settings. A null value omits the value attribute
  entirely (th:attr, unlike th:value, drops null attributes), matching the
  legacy output for an unset setting. INT settings never render an error.
*/-->
<div th:fragment="numberInput(id, name, value, readOnly)" class="margin-top-1">
  <div class="margin-bottom-1" th:data-testid="|int-${name}|">
    <label th:for="${id}" class="usa-sr-only"
      ><span
        th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(false)}"
      ></span
    ></label>
    <div class="display-flex flex-column">
      <!--/* [html-validate-disable-next input-attributes -- legacy parity, j2html FieldWithLabel puts maxlength on every input] */-->
      <input
        type="number"
        inputmode="decimal"
        step="any"
        th:attr="value=${value}"
        maxlength="10000"
        th:id="${id}"
        th:name="${name}"
        placeholder="empty"
        th:disabled="${readOnly}"
        th:readonly="${readOnly}"
        class="usa-input maxw-full"
      />
      <div th:id="|${id}-errors|" class="usa-error-message display-none"></div>
    </div>
    <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
  </div>
</div>

<!--/*
  Select for ENUM settings. The blank placeholder option is selectable, as
  SelectWithLabel.setPlaceholderVisible(true) made it, and the legacy code put
  the options in a single unlabeled optgroup. ENUM settings never render an
  error.
*/-->
<div
  th:fragment="enumInput(id, name, value, allowableValues, readOnly)"
  class="margin-top-1"
>
  <div class="margin-bottom-1" th:data-testid="|enum-${name}|">
    <label th:for="${id}" class="usa-sr-only"
      ><span
        th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(false)}"
      ></span
    ></label>
    <div class="display-flex flex-column">
      <!--/* maxlength is meaningless on a select, but FieldWithLabel set it. */-->
      <select
        maxlength="10000"
        th:id="${id}"
        th:name="${name}"
        th:disabled="${readOnly}"
        th:readonly="${readOnly}"
        class="usa-select maxw-full"
      >
        <option value="" th:selected="${#strings.isEmpty(value)}"></option>
        <optgroup label="">
          <option
            th:each="allowableValue : ${allowableValues}"
            class="cf-multi-option-question-option cf-multi-option-value"
            th:value="${allowableValue}"
            th:selected="${allowableValue == value}"
            th:text="${allowableValue}"
          ></option>
        </optgroup>
      </select>
      <div th:id="|${id}-errors|" class="usa-error-message display-none"></div>
    </div>
    <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
  </div>
</div>

<!--/*
  True/False tile radios for BOOLEAN settings. USWDS styles the label off its
  sibling input, so the test id sits on the wrapping usa-radio rather than on
  the label; it still contains the radio, which the browser tests look up.
*/-->
<div
  th:fragment="boolInput(trueId, falseId, name, checked, readOnly, errorMessage)"
>
  <div class="display-flex margin-top-1">
    <div
      th:data-testid="|enable-${name}|"
      class="usa-radio flex-fill margin-right-2"
    >
      <!--/* [html-validate-disable-next input-attributes -- legacy parity, j2html FieldWithLabel puts maxlength on every input] */-->
      <input
        type="radio"
        value="true"
        maxlength="10000"
        th:id="${trueId}"
        th:name="${name}"
        th:disabled="${readOnly}"
        class="usa-radio__input usa-radio__input--tile"
        th:checked="${checked}"
      />
      <label th:for="${trueId}" class="usa-radio__label">True</label>
    </div>
    <div th:data-testid="|disable-${name}|" class="usa-radio flex-fill">
      <!--/* [html-validate-disable-next input-attributes -- legacy parity, j2html FieldWithLabel puts maxlength on every input] */-->
      <input
        type="radio"
        value="false"
        maxlength="10000"
        th:id="${falseId}"
        th:name="${name}"
        th:disabled="${readOnly}"
        class="usa-radio__input usa-radio__input--tile"
        th:checked="${!checked}"
      />
      <label th:for="${falseId}" class="usa-radio__label">False</label>
    </div>
  </div>
  <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
  <div
    th:if="${errorMessage != null}"
    class="usa-error-message"
    th:text="${errorMessage}"
  ></div>
</div>

<!--/* Note shown under read-only settings. */-->
<div
  th:fragment="readOnlyText(readOnly)"
  th:if="${readOnly}"
  class="usa-hint font-sans-3xs margin-top-1"
>
  Read-only
</div>
