<!--/*
  Inputs for a single server setting, legacy FieldWithLabel/SelectWithLabel
  parity markup for the migrated admin settings page.

  The settings page never labels its fields (the variable name is rendered
  above the input instead), so every field carries the screen-reader-only
  empty label and hidden required indicator that FieldWithLabel emitted for a
  field with no label text.

  Read-only settings render disabled (and, where the legacy code set it,
  read-only) inputs plus the "Read-only" note.
*/-->

<!--/* Text input for STRING and LIST_OF_STRINGS settings. */-->
<div
  th:fragment="stringInput(id, name, value, readOnly, errorMessage)"
  class="mt-2"
>
  <div class="mb-2" th:data-testid="|string-${name}|">
    <label th:for="${id}" class="sr-only"
      ><span
        th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(false)}"
      ></span
    ></label>
    <div class="flex flex-col">
      <input
        type="text"
        th:value="${value}"
        maxlength="10000"
        th:id="${id}"
        th:name="${name}"
        placeholder="empty"
        th:disabled="${readOnly}"
        th:readonly="${readOnly}"
        class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue placeholder-gray-500"
        th:classappend="${readOnly} ? 'read-only:text-gray-500 read-only:bg-gray-100' : ''"
      />
      <div th:id="|${id}-errors|" class="text-red-600 text-xs p-1 hidden"></div>
    </div>
    <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
    <div
      th:if="${errorMessage != null}"
      class="text-red-600 text-xs"
      th:text="${errorMessage}"
    ></div>
  </div>
</div>

<!--/*
  Number input for INT settings. A null value omits the value attribute
  entirely (th:attr, unlike th:value, drops null attributes), matching the
  legacy output for an unset setting. INT settings never render an error.
*/-->
<div th:fragment="numberInput(id, name, value, readOnly)" class="mt-2">
  <div class="mb-2" th:data-testid="|int-${name}|">
    <label th:for="${id}" class="sr-only"
      ><span
        th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(false)}"
      ></span
    ></label>
    <div class="flex flex-col">
      <input
        type="number"
        inputmode="decimal"
        step="any"
        th:attr="value=${value}"
        maxlength="10000"
        th:id="${id}"
        th:name="${name}"
        placeholder="empty"
        th:disabled="${readOnly}"
        th:readonly="${readOnly}"
        class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue placeholder-gray-500"
        th:classappend="${readOnly} ? 'read-only:text-gray-500 read-only:bg-gray-100' : ''"
      />
      <div th:id="|${id}-errors|" class="text-red-600 text-xs p-1 hidden"></div>
    </div>
    <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
  </div>
</div>

<!--/*
  Select for ENUM settings. The blank placeholder option is selectable, as
  SelectWithLabel.setPlaceholderVisible(true) made it, and the legacy code put
  the options in a single unlabeled optgroup. ENUM settings never render an
  error.
*/-->
<div
  th:fragment="enumInput(id, name, value, allowableValues, readOnly)"
  class="mt-2"
>
  <div class="mb-2" th:data-testid="|enum-${name}|">
    <label th:for="${id}" class="sr-only"
      ><span
        th:replace="~{admin/shared/LegacyFieldWithLabel/RequiredIndicator :: requiredIndicator(false)}"
      ></span
    ></label>
    <div class="flex flex-col">
      <!--/* maxlength is meaningless on a select, but FieldWithLabel set it. */-->
      <select
        maxlength="10000"
        th:id="${id}"
        th:name="${name}"
        th:disabled="${readOnly}"
        th:readonly="${readOnly}"
        class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue placeholder-gray-500 h-11.5"
        th:classappend="${readOnly} ? 'read-only:text-gray-500 read-only:bg-gray-100' : ''"
      >
        <option value="" th:selected="${#strings.isEmpty(value)}"></option>
        <optgroup label="">
          <option
            th:each="allowableValue : ${allowableValues}"
            class="cf-multi-option-question-option cf-multi-option-value"
            th:value="${allowableValue}"
            th:selected="${allowableValue == value}"
            th:text="${allowableValue}"
          ></option>
        </optgroup>
      </select>
      <div th:id="|${id}-errors|" class="text-red-600 text-xs p-1 hidden"></div>
    </div>
    <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
  </div>
</div>

<!--/*
  True/False radios for BOOLEAN settings. Read-only settings get the legacy
  "bg-gray-100 text-gray-500" label classes; the legacy code joined them right
  after "mr-4", but class order has no effect so they are appended here.
*/-->
<div
  th:fragment="boolInput(trueId, falseId, name, checked, readOnly, errorMessage)"
>
  <div class="flex mt-2">
    <label
      th:for="${trueId}"
      th:data-testid="|enable-${name}|"
      class="mr-4 px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue align-middle flex flex-row mb-2 cf-radio-option"
      th:classappend="${readOnly} ? 'bg-gray-100 text-gray-500' : ''"
      ><input
        type="radio"
        value="true"
        maxlength="10000"
        th:id="${trueId}"
        th:name="${name}"
        th:disabled="${readOnly}"
        class="h-4 w-4 mr-4 align-middle self-center flex-none"
        th:checked="${checked}"
      />True</label
    >
    <label
      th:for="${falseId}"
      th:data-testid="|disable-${name}|"
      class="px-3 bg-white text-black text-lg py-2 block outline-none box-border m-auto border border-gray-500 rounded-lg w-full focus:border-civiform-blue align-middle flex flex-row mb-2 cf-radio-option"
      th:classappend="${readOnly} ? 'bg-gray-100 text-gray-500' : ''"
      ><input
        type="radio"
        value="false"
        maxlength="10000"
        th:id="${falseId}"
        th:name="${name}"
        th:disabled="${readOnly}"
        class="h-4 w-4 mr-4 align-middle self-center flex-none"
        th:checked="${!checked}"
      />False</label
    >
  </div>
  <div th:replace="~{:: readOnlyText(${readOnly})}"></div>
  <div
    th:if="${errorMessage != null}"
    class="text-red-600 text-xs"
    th:text="${errorMessage}"
  ></div>
</div>

<!--/* The legacy AdminSettingsIndexView.READ_ONLY_TEXT note. */-->
<div
  th:fragment="readOnlyText(readOnly)"
  th:if="${readOnly}"
  class="text-xs mt-2 text-gray-600"
>
  Read-only
</div>
