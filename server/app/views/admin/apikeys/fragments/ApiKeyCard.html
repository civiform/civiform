<!--/*
  A single API key entry on the API keys index page.
*/-->
<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="apiKey" type="views.admin.apikeys.ApiKeyIndexPageViewModel.ApiKey"*/-->
<div
  th:fragment="apiKeyCard(apiKey)"
  class="width-full margin-bottom-3 padding-2 bg-white border-1px border-base-lighter radius-md shadow-3"
>
  <!--/* Name and status have to stay in one text run: browser tests assert on
         "<name> active" / "<name> retired". The leading space inside the
         substitution reproduces the legacy " active" span text. */-->
  <h2 class="margin-top-0 margin-bottom-1 cf-api-key-name">
    [[${apiKey.name}]]<span
      class="text-base-dark font-sans-xs text-normal"
      th:text="| ${apiKey.status}|"
    ></span>
  </h2>

  <div class="display-flex flex-justify flex-wrap">
    <div>
      <p class="margin-0 cf-bt-api-key-id" th:text="|ID: ${apiKey.keyId}|"></p>
      <p
        class="margin-0 text-base-dark font-sans-xs"
        th:text="|Allowed subnets: ${apiKey.subnets}|"
      ></p>
      <p
        class="margin-0 text-base-dark font-sans-xs cf-bt-date"
        th:text="|Expires on: ${apiKey.expirationDate}|"
      ></p>
    </div>
    <div class="font-sans-3xs">
      <p
        class="margin-0 cf-bt-date"
        th:text="|Created ${apiKey.createdDate}|"
      ></p>
      <p
        class="margin-0 cf-bt-api-key-created-by"
        th:text="|Created by ${apiKey.createdBy}|"
      ></p>
      <p
        class="margin-0"
        th:id="|${apiKey.nameSlug}-last-call-ip|"
        th:text="|Last used by ${apiKey.lastCallIp}|"
      ></p>
      <p
        class="margin-0"
        th:id="|${apiKey.nameSlug}-call-count|"
        th:text="|Call count: ${apiKey.callCount}|"
      ></p>
      <p
        class="margin-0"
        th:if="${apiKey.retired}"
        th:text="|Retired ${apiKey.retiredDate}|"
      ></p>
    </div>
  </div>

  <div class="display-flex flex-justify flex-align-end margin-top-2 flex-wrap">
    <table class="usa-table usa-table--borderless usa-table--compact margin-0">
      <thead>
        <tr>
          <th scope="col">Program name</th>
          <th scope="col">Program slug</th>
          <th scope="col">Permission</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="grant : ${apiKey.grants}">
          <td th:text="${grant.programName}"></td>
          <td th:text="${grant.programSlug}"></td>
          <td th:text="${grant.permission}"></td>
        </tr>
      </tbody>
    </table>

    <!--/* Retired keys cannot be retired again. admin_api_keys.ts hooks the
           submit event on .retire-key-form to confirm first. */-->
    <form
      th:unless="${apiKey.retired}"
      th:action="${apiKey.retireUrl}"
      method="POST"
      th:id="|retire-${apiKey.nameSlug}|"
      th:data-api-key-name="${apiKey.name}"
      class="retire-key-form"
    >
      <input
        hidden
        th:value="${templateGlobals.csrfToken()}"
        name="csrfToken"
      />
      <button
        type="submit"
        class="usa-button usa-button--outline display-flex flex-align-center margin-right-0"
      >
        <svg
          th:replace="~{admin/shared/LegacySvgFragments :: iconDelete('usa-icon margin-right-05')}"
        ></svg>
        <span>Retire key</span>
      </button>
    </form>
  </div>
</div>
