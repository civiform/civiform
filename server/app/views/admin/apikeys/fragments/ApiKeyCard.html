<!--/*
  A single API key entry on the API keys index page.

  Legacy counterpart: ApiKeyIndexView#renderApiKey.
*/-->
<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="apiKey" type="views.admin.apikeys.ApiKeyIndexPageViewModel.ApiKey"*/-->
<div th:fragment="apiKeyCard(apiKey)" class="w-full shadow-lg mb-6">
  <div class="border border-gray-300 bg-white rounded p-4">
    <!--/* Name and status have to stay in one text run: browser tests assert on
           "<name> active" / "<name> retired". The leading space inside the
           substitution reproduces the legacy " active" span text. */-->
    <h2 class="mb-2 cf-api-key-name">
      [[${apiKey.name}]]<span
        class="text-gray-700 text-sm"
        th:text="| ${apiKey.status}|"
      ></span>
    </h2>

    <div class="flex place-content-between">
      <div>
        <div>
          <!--/* The legacy view called withClasses twice on this <p>. The second
                 call replaced the class attribute, so the gray text styles the
                 sibling paragraphs have never made it into the DOM. */-->
          <p class="cf-bt-api-key-id" th:text="|ID: ${apiKey.keyId}|"></p>
          <p
            class="text-gray-700 text-sm"
            th:text="|Allowed subnets: ${apiKey.subnets}|"
          ></p>
          <p
            class="text-gray-700 text-sm cf-bt-date"
            th:text="|Expires on: ${apiKey.expirationDate}|"
          ></p>
        </div>
      </div>
      <div class="text-xs">
        <p class="cf-bt-date" th:text="|Created ${apiKey.createdDate}|"></p>
        <p
          class="cf-bt-api-key-created-by"
          th:text="|Created by ${apiKey.createdBy}|"
        ></p>
        <p
          th:id="|${apiKey.nameSlug}-last-call-ip|"
          th:text="|Last used by ${apiKey.lastCallIp}|"
        ></p>
        <p
          th:id="|${apiKey.nameSlug}-call-count|"
          th:text="|Call count: ${apiKey.callCount}|"
        ></p>
        <p
          th:if="${apiKey.retired}"
          th:text="|Retired ${apiKey.retiredDate}|"
        ></p>
      </div>
    </div>

    <div class="flex place-content-between mt-4">
      <table class="table-auto w-2/3">
        <tr>
          <th class="text-left text-sm">Program name</th>
          <th class="text-left text-sm">Program slug</th>
          <th class="text-left text-sm">Permission</th>
        </tr>
        <tr th:each="grant : ${apiKey.grants}">
          <td th:text="${grant.programName}"></td>
          <td th:text="${grant.programSlug}"></td>
          <td th:text="${grant.permission}"></td>
        </tr>
      </table>
      <div class="flex">
        <!--/* Retired keys cannot be retired again. admin_api_keys.ts hooks the
               submit event on .retire-key-form to confirm first. */-->
        <form
          th:unless="${apiKey.retired}"
          th:action="${apiKey.retireUrl}"
          method="POST"
          th:id="|retire-${apiKey.nameSlug}|"
          th:data-api-key-name="${apiKey.name}"
          class="retire-key-form"
        >
          <input
            hidden
            th:value="${templateGlobals.csrfToken()}"
            name="csrfToken"
          />
          <button
            class="font-semibold block py-2 text-center rounded-full border text-civiform-blue border-civiform-blue hover:bg-blue-100 flex items-center font-medium space-x-2 bg-white hover:bg-gray-200"
          >
            <svg
              th:replace="~{admin/shared/LegacySvgFragments :: iconDelete('inline-block h-4.5 w-4.5')}"
            ></svg>
            <span class="text-left">Retire key</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
