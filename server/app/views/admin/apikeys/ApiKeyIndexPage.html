<!--/*@thymesVar id="templateGlobals" type="views.shared.TemplateGlobals"*/-->
<!--/*@thymesVar id="model" type="views.admin.apikeys.ApiKeyIndexPageViewModel"*/-->
<th:block th:fragment="content">
  <div class="padding-x-4">
    <div
      class="display-flex flex-align-center flex-justify margin-y-4 flex-wrap"
    >
      <h1 class="margin-0" th:text="${model.title}"></h1>
      <!--/* data-redirect-to is picked up by main.ts, as
             BaseHtmlView.asRedirectElement intended. */-->
      <button
        id="new-api-key-button"
        type="button"
        class="usa-button display-flex flex-align-center margin-right-0"
        th:data-redirect-to="${model.newKeyUrl}"
      >
        <svg
          th:replace="~{admin/shared/LegacySvgFragments :: iconPlus('usa-icon margin-right-05')}"
        ></svg>
        <span>New API key</span>
      </button>
    </div>

    <!--/* Status filters. The selected one is underlined. */-->
    <nav aria-label="API key status" class="display-flex flex-wrap">
      <a
        th:each="link : ${model.filterLinks}"
        th:href="${link.href}"
        class="usa-link margin-1 padding-bottom-05"
        th:classappend="${link.selected} ? 'border-bottom-05 border-primary text-no-underline'"
        th:attr="aria-current=${link.selected} ? 'page' : null"
        th:text="${link.text}"
      ></a>
    </nav>

    <div>
      <p
        th:unless="${model.hasApiKeys}"
        class="padding-2"
        th:text="|No ${model.selectedStatusLowercase} API keys found.|"
      ></p>
      <th:block th:each="apiKey : ${model.apiKeys}">
        <div
          th:replace="~{admin/apikeys/fragments/ApiKeyCard :: apiKeyCard(${apiKey})}"
        ></div>
      </th:block>
    </div>
  </div>
</th:block>
