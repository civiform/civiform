<!--/*@thymesVar id="model" type="views.admin.migration.AdminImportErrorPartialViewModel"*/-->
<div id="program-data">
  <div class="usa-alert usa-alert--error" aria-live="polite" role="alert">
    <div class="usa-alert__body">
      <h4
        th:if="${model.title != null}"
        class="usa-alert__heading"
        th:text="${model.title}"
      ></h4>
      <p
        th:each="line : ${model.errorLines}"
        class="usa-alert__text"
        th:text="${#lists.size(model.errorLines) > 1 ? '• ' + line : line}"
      ></p>
    </div>
  </div>
  <button
    type="button"
    th:attr="data-redirect-to=${model.tryAgainUrl}"
    class="my-5 usa-button usa-button--outline"
  >
    Try again
  </button>
</div>
