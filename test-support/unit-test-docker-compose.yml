# Use postgres/example user/password credentials
services:
  db:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    restart: always
    expose:
      - '5432'
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - ../init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql

  dev-oidc:
    image: civiform-oidc-provider
    restart: always
    expose:
      - 3390
    environment:
      - OIDC_PORT=3390

  mock-web-services:
    image: civiform-mock-web-services

  civiform:
    image: civiform-dev
    restart: always
    volumes:
      - ../server/code-coverage:/usr/src/server/code-coverage
      # Read-only, so MetricsControllerTest can check the dashboard against /metrics.
      - ../monitoring:/usr/src/monitoring:ro
    entrypoint: /bin/bash
    tty: true # keep the container running
    stdin_open: true
    # For debugging. Override the host ports to run more than one test
    # environment at once (e.g. from separate worktrees); 0 picks a free port.
    ports:
      - ${CIVIFORM_TEST_HTTP_HOST_PORT:-9100}:9000
      - ${CIVIFORM_TEST_DEBUG_HOST_PORT:-8459}:8459
    environment:
      - AWS_ACCESS_KEY_ID=testAccessKey
      - AWS_SECRET_ACCESS_KEY=testSecretKey
      - AWS_SESSION_TOKEN=testSession
      - DISABLE_ERRORPRONE=${DISABLE_ERRORPRONE:-false}
      - IDCS_CLIENT_ID=idcs-fake-oidc-client
      - IDCS_SECRET=idcs-fake-oidc-secret
      - IDCS_DISCOVERY_URI=http://dev-oidc:3390/.well-known/openid-configuration
      - DB_JDBC_STRING=jdbc:postgresql://db:5432/postgres
      - BASE_URL=http://localhost:9000
      - CIVIFORM_TIME_ZONE_ID
